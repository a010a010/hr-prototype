<html lang="ko">

<title>근태·휴가 시스템 프로토타입</title>

<style>

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--card:#181b22;--text:#eceef3;--muted:#98a0ad;--line:#2a2f3a;
    --primary:#4c9aff;--primary-ink:#06101f;--nav:#142a47;--nav-ink:#8fa3bf;--nav-on:#fff;
    --green:#5fd18a;--green-bg:#17301f;--red:#ff7b7b;--amber:#f5c15a;--amber-bg:#3a2e12;
    --teal:#33c6bb;--track:#2a2f3a;--today:#1b2a44;--dim:rgba(0,0,0,.65);--off:#14171d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b22;--text:#eceef3;--muted:#98a0ad;--line:#2a2f3a;
  --primary:#4c9aff;--primary-ink:#06101f;--nav:#142a47;--nav-ink:#8fa3bf;--nav-on:#fff;
  --green:#5fd18a;--green-bg:#17301f;--red:#ff7b7b;--amber:#f5c15a;--amber-bg:#3a2e12;
  --teal:#33c6bb;--track:#2a2f3a;--today:#1b2a44;--dim:rgba(0,0,0,.65);--off:#14171d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

:root[data-theme="dark"] .hdr .logo{color:var(--text)}

.ib{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;position:relative}
.ib:focus-visible,.btn:focus-visible,.tab:focus-visible,.cell:focus-visible,.rowbtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.badge.gray{background:var(--muted)}
.main{padding:12px 12px 96px}

.card.flush{padding:0}

.muted{color:var(--muted)}
.small{font-size:13px}
.kv{display:flex;justify-content:space-between;padding:9px 0}
.kv b{font-weight:500}
.green{color:var(--green)}
.chip{display:inline-block;padding:2px 9px;border-radius:5px;font-size:13px;background:var(--off);color:var(--muted);font-weight:500}
.chip.ok{background:var(--green-bg);color:var(--green)}

.chip.no{background:#fde4e4;color:#b42323}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.no{background:#3b1c1c;color:#ff9b9b}}
.chip.live{background:var(--today);color:var(--primary)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:0 16px;height:48px;font-weight:700}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
/* ---- dates.js ---- */
// 날짜는 모두 'YYYY-MM-DD' 문자열로 다루고, 내부 계산은 UTC로 해서 시간대 문제를 피한다.
const pad = (n) => String(n).padStart(2, '0');

function parseYMD(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function ymd(d) {
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
}
function addDays(s, n) {
  const d = parseYMD(s);
  d.setUTCDate(d.getUTCDate() + n);
  return ymd(d);
}
// 말일 보정: 1/31 + 1개월 = 2/28(29)
function addMonths(s, n) {
  const d = parseYMD(s);
  const day = d.getUTCDate();
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last));
  return ymd(t);
}
function diffDays(a, b) {
  return Math.round((parseYMD(b) - parseYMD(a)) / 86400000);
}
function dayOfWeek(s) {
  return parseYMD(s).getUTCDay(); // 0=일 ... 6=토
}
// b 시점에 a로부터 꽉 채운 연수
function fullYearsBetween(a, b) {
  const x = parseYMD(a), y = parseYMD(b);
  let years = y.getUTCFullYear() - x.getUTCFullYear();
  const before =
    y.getUTCMonth() < x.getUTCMonth() ||
    (y.getUTCMonth() === x.getUTCMonth() && y.getUTCDate() < x.getUTCDate());
  if (before) years -= 1;
  return years;
}
function daysInMonth(year, month) {
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}

/* ---- attendance.js ---- */

// 관리자 설정값(policies 테이블)과 1:1로 대응한다.
const DEFAULT_POLICY = {
  breakMinutes: 60,          // 하루 고정 휴게 공제 (체류시간과 무관)
  leaveHoursPerDay: 8,       // 연차 1일 = 8시간으로 환산 (반차는 절반)
  weeklyHolidayDow: [0],     // 휴일근로로 분리 집계할 요일 (0=일요일)
};

function toMinutes(hm) {
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}

// 하루 실근로(분) = 체류시간 - 고정 휴게. 퇴근이 출근보다 이르면 익일 퇴근으로 본다.
function dailyWorkMinutes(record, policy = DEFAULT_POLICY) {
  if (!record || !record.clockIn || !record.clockOut) return 0;
  let stay = toMinutes(record.clockOut) - toMinutes(record.clockIn);
  if (stay < 0) stay += 24 * 60;
  return Math.max(0, stay - policy.breakMinutes);
}

function fmtMinutes(min) {
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
}

/**
 * 월 근태 집계
 * @param records  [{date, clockIn:'09:00', clockOut:'18:00'}]
 * @param leaves   승인된 휴가를 일 단위로 펼친 것 [{date, minutes}] — minutes는 휴가 유형의 '유급 인정 시간'.
 *                 minutes가 없으면 {date, days}를 days × leaveHoursPerDay로 환산(하위 호환).
 * @param holidays 공휴일 ['YYYY-MM-DD']
 * 규칙: 휴가는 근무일에만 환산, 휴일(일요일·공휴일) 근무는 평일 합계와 분리 집계.
 */
function summarizeMonth({ year, month, records, leaves = [], holidays = [], policy = DEFAULT_POLICY }) {
  const recByDate = new Map(records.map((r) => [r.date, r]));
  const leaveByDate = new Map(); // date → 인정 분
  for (const l of leaves) {
    const minutes = l.minutes ?? (l.days ?? 0) * policy.leaveHoursPerDay * 60;
    leaveByDate.set(l.date, (leaveByDate.get(l.date) ?? 0) + minutes);
  }
  const holidaySet = new Set(holidays);

  let workMinutes = 0, leaveMinutes = 0, holidayWorkMinutes = 0, workDays = 0;
  const details = [];

  for (let d = 1; d <= daysInMonth(year, month); d++) {
    const date = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isHoliday = policy.weeklyHolidayDow.includes(dayOfWeek(date)) || holidaySet.has(date);
    const work = dailyWorkMinutes(recByDate.get(date), policy);

    if (isHoliday) {
      holidayWorkMinutes += work;
      if (work > 0) details.push({ date, kind: 'holiday', workMinutes: work, leaveMinutes: 0 });
      continue;
    }
    const leave = leaveByDate.get(date) ?? 0;
    workMinutes += work;
    leaveMinutes += leave;
    if (work > 0) workDays += 1;
    if (work > 0 || leave > 0) details.push({ date, kind: 'weekday', workMinutes: work, leaveMinutes: leave });
  }

  return {
    workMinutes,
    leaveMinutes,
    weekdayMinutes: workMinutes + leaveMinutes, // 평일 합계 = 실근로 + 휴가 환산
    holidayWorkMinutes,                          // 휴일근로는 별도
    workDays,
    details,
  };
}

/**
 * 월 소정근로시간(분) = (휴일이 아닌 날 수) × 하루 소정시간
 * 휴일 = weeklyHolidayDow(일요일) + 공휴일·대체공휴일. 토요일은 휴일로 보지 않지만
 * 이 회사처럼 주 5일제이면 weeklyHolidayDow에 6(토)을 포함해 설정한다.
 * @param dailyMinutes 하루 소정근로시간(분), 기본 8시간
 * @param offDow       소정근로일에서 제외할 요일 (기본: 토·일)
 */
function scheduledMinutes({ year, month, holidays = [], dailyMinutes = 480, offDow = [0, 6] }) {
  const holidaySet = new Set(holidays);
  let days = 0;
  for (let d = 1; d <= daysInMonth(year, month); d++) {
    const date = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (offDow.includes(dayOfWeek(date)) || holidaySet.has(date)) continue;
    days += 1;
  }
  return { days, minutes: days * dailyMinutes };
}

/* ---- leave.js ---- */

const DEFAULT_LEAVE_POLICY = {
  basis: 'hire_date',          // 'hire_date'(입사일) | 'fiscal_year'(회계연도)
  fiscalYearStartMonth: 1,     // 회계연도 시작 월
  prorateRounding: 'ceil',     // 비례 연차 0.5일 단위 처리: ceil | round | floor
};

function roundHalf(x, mode) {
  const v = x * 2;
  const r = mode === 'floor' ? Math.floor(v) : mode === 'round' ? Math.round(v) : Math.ceil(v);
  return r / 2;
}
// 근로기준법 제60조: 1년 이상 15일, 3년차부터 2년마다 1일 가산, 최대 25일
function annualDaysForServiceYear(n) {
  return Math.min(25, 15 + Math.floor((n - 1) / 2));
}
const expiry = (date) => addDays(addMonths(date, 12), -1);

/**
 * 연차 발생 내역 생성 (출근율 80% 이상/월 개근을 가정. 미충족은 관리자가 수동 조정)
 * 반환: [{date, days, kind: 'monthly'|'annual'|'prorated', expires}]
 */
function generateGrants(hireDate, asOf, policy = DEFAULT_LEAVE_POLICY) {
  return policy.basis === 'fiscal_year'
    ? grantsFiscal(hireDate, asOf, policy)
    : grantsHireDate(hireDate, asOf);
}

function grantsHireDate(hire, asOf) {
  const grants = [];
  const oneYear = addMonths(hire, 12);
  for (let k = 1; k <= 11; k++) {
    const date = addMonths(hire, k);
    if (date >= oneYear || date > asOf) break;
    grants.push({ date, days: 1, kind: 'monthly', expires: expiry(date) });
  }
  for (let n = 1; ; n++) {
    const date = addMonths(hire, 12 * n);
    if (date > asOf) break;
    grants.push({ date, days: annualDaysForServiceYear(n), kind: 'annual', expires: expiry(date) });
  }
  return grants;
}

function grantsFiscal(hire, asOf, policy) {
  const grants = [];
  const m = String(policy.fiscalYearStartMonth).padStart(2, '0');
  const hireYear = Number(hire.slice(0, 4));
  let firstStart = `${hireYear}-${m}-01`;
  if (firstStart <= hire) firstStart = `${hireYear + 1}-${m}-01`;

  // 입사 첫 회계연도: 만 1개월 개근마다 1일 (최대 11일)
  for (let k = 1; k <= 11; k++) {
    const date = addMonths(hire, k);
    if (date >= firstStart || date > asOf) break;
    grants.push({ date, days: 1, kind: 'monthly', expires: expiry(date) });
  }
  // 첫 회계연도 시작일: 입사일~회계연도 말 재직일수 비례 (15일 상한)
  if (firstStart <= asOf) {
    const prorated = Math.min(15, roundHalf((15 * diffDays(hire, firstStart)) / 365, policy.prorateRounding));
    grants.push({ date: firstStart, days: prorated, kind: 'prorated', expires: expiry(firstStart) });
  }
  // 이후 회계연도 시작일: 시작일 시점 만 근속연수 기준
  for (let i = 1; ; i++) {
    const date = `${Number(firstStart.slice(0, 4)) + i}-${m}-01`;
    if (date > asOf) break;
    const years = Math.max(1, fullYearsBetween(hire, date));
    grants.push({ date, days: annualDaysForServiceYear(years), kind: 'annual', expires: expiry(date) });
  }
  return grants;
}

/**
 * 잔여 연차 계산: 사용분은 사용일에 유효한 발생분 중 소멸일이 빠른 것부터 차감(FIFO).
 * @param grants [{date, days, expires}]  (수동 조정 포함)
 * @param used   [{date, days}]           승인된 사용 내역
 */
function leaveBalance({ grants, used, asOf }) {
  const pool = grants
    .filter((g) => g.date <= asOf)
    .map((g) => ({ ...g, remaining: g.days }))
    .sort((a, b) => a.expires.localeCompare(b.expires));
  let shortage = 0;
  const usedSoFar = used.filter((x) => x.date <= asOf).sort((a, b) => a.date.localeCompare(b.date));
  for (const u of usedSoFar) {
    let need = u.days;
    for (const g of pool) {
      if (need <= 0) break;
      if (g.date <= u.date && u.date <= g.expires && g.remaining > 0) {
        const take = Math.min(g.remaining, need);
        g.remaining -= take;
        need -= take;
      }
    }
    shortage += need; // 발생분 부족(마이너스 연차)
  }
  const available = pool.filter((g) => g.expires >= asOf).reduce((s, g) => s + g.remaining, 0);
  const granted = grants.filter((g) => g.date <= asOf).reduce((s, g) => s + g.days, 0);
  const usedTotal = usedSoFar.reduce((s, x) => s + x.days, 0);
  return { granted, used: usedTotal, remaining: available - shortage, shortage };
}

/**
 * 퇴직 시 연차 재정산 (회사가 회계연도 기준으로 부여한 경우: "퇴직 시에는 입사일 기준으로 재정산").
 * 입사일 기준으로 퇴직일까지 발생했어야 할 연차 총량과, 회계연도 기준으로 실제 부여한 총량을 비교한다.
 *  - extraDays > 0 : 입사일 기준이 더 많음 → 회사가 추가로 인정해야 할 일수
 *  - extraDays < 0 : 회계연도 기준으로 더 많이 부여함 → 초과 부여분(회수 여부는 회사 규정·노무 검토 사항)
 *  - unusedHireBasis: 입사일 기준 총량에서 사용한 일수를 뺀 값 (연차수당 정산 대상 일수의 기준)
 * 주의: 계산 보조 도구이며, 연차수당 지급 여부·금액은 인사 담당자·노무사가 확정해야 한다.
 */
function retirementSettlement({ hireDate, retireDate, usedDays, leavePolicy = DEFAULT_LEAVE_POLICY }) {
  const sum = (gs) => gs.reduce((s, g) => s + g.days, 0);
  const hireBasis = sum(generateGrants(hireDate, retireDate, { ...leavePolicy, basis: 'hire_date' }));
  const fiscalBasis = sum(generateGrants(hireDate, retireDate, { ...leavePolicy, basis: 'fiscal_year' }));
  return {
    hireBasisTotal: hireBasis,
    fiscalBasisTotal: fiscalBasis,
    extraDays: hireBasis - fiscalBasis,
    unusedHireBasis: hireBasis - usedDays,
    unusedFiscalBasis: fiscalBasis - usedDays,
  };
}

/* ---- leaveTypes.js ---- */
/**
 * 휴가 유형은 관리자가 만들고 고치는 데이터다. 복합 유형(예: 건강검진 = 공가 0.5 + 반차 0.5)은
 * components로 표현하고, 인정 시간과 연차 차감 일수는 구성요소를 합산해서 구한다.
 *
 * type = {
 *   name, group,
 *   components: [{ label, minutes, deductDays }],  // minutes: 유급 인정 분, deductDays: 연차 차감 일수
 *   deductFrom: 'annual' | 'own_quota' | 'none',   // 차감 대상 (기본 연차)
 * }
 */
function resolveLeaveType(type) {
  const paidMinutes = type.components.reduce((s, c) => s + c.minutes, 0);
  const deductDays = type.components.reduce((s, c) => s + c.deductDays, 0);
  return { paidMinutes, deductDays };
}

/* ---- approval.js ---- */
/**
 * 승인권자 후보 계산 — 관리자가 설정하는 승인 정책에 따라 결정된다.
 *
 * 조직(orgUnits): [{ id, name, parentId, headId }]   headId = 그 조직의 장(팀장·부서장·임원 등), 공석이면 null
 * 구성원(people): [{ id, name, orgId, status }]       status: 'active' | 'leave' | 'resigned'
 *
 * 후보 = 신청자 소속 조직부터 위로 올라가며 만나는 조직장들(팀장 → 부서장 → 임원 ...) + 정책의 추가 승인권자.
 * 신청자 본인은 제외하므로, 팀장이 신청하면 자동으로 상위 부서장부터 후보가 된다.
 */
const DEFAULT_APPROVAL_POLICY = {
  maxLevelsUp: null,     // 소속 조직에서 몇 단계 위까지 후보로 둘지 (0 = 소속 조직장만, null = 최상위까지)
  extraApproverIds: [],  // 항상 후보에 추가할 사람 (예: 대표, 인사 담당)
  steps: 1,              // 결재 단계 수 (화면의 "승인권자 1 / 1")
};

function approverCandidates({ requesterId, people, orgUnits, policy = DEFAULT_APPROVAL_POLICY }) {
  const personById = new Map(people.map((p) => [p.id, p]));
  const orgById = new Map(orgUnits.map((o) => [o.id, o]));
  const requester = personById.get(requesterId);
  if (!requester) return [];

  const isActive = (id) => personById.get(id)?.status === 'active';
  const result = [];
  const push = (id) => {
    if (id && id !== requesterId && isActive(id) && !result.includes(id)) result.push(id);
  };

  let org = orgById.get(requester.orgId);
  let level = 0;
  const seen = new Set();
  while (org && !seen.has(org.id) && (policy.maxLevelsUp == null || level <= policy.maxLevelsUp)) {
    seen.add(org.id);
    push(org.headId);   // 공석·본인·비활성이면 건너뛰고 다음 상위 조직으로
    org = orgById.get(org.parentId);
    level += 1;
  }
  for (const id of policy.extraApproverIds ?? []) push(id);
  return result;
}

/** 서버(DB)에서도 같은 규칙으로 다시 검증해야 한다. 화면에서만 막으면 우회할 수 있다. */
function isValidApprover(args, approverId) {
  return approverCandidates(args).includes(approverId);
}

/**
 * 요청 종류별 승인 정책 선택. overrides: { 'leave_type:<id>': policy, 'request:<kind>': policy }
 * 가장 구체적인 설정(휴가 유형) → 요청 종류 → 기본 순으로 적용.
 */
function policyFor({ leaveTypeId, requestKind, overrides = {}, base = DEFAULT_APPROVAL_POLICY }) {
  return (
    overrides[`leave_type:${leaveTypeId}`] ??
    overrides[`request:${requestKind}`] ??
    base
  );
}

/* ---- geofence.js ---- */
/**
 * 출퇴근 위치 제한 — 관리자가 켜고 끄고, 허용 거리를 정한다.
 *
 * policy = {
 *   enabled,            // 위치 제한 사용 여부
 *   radiusMeters,       // 기본 허용 반경(m)
 *   maxAccuracyMeters,  // 이보다 GPS 오차가 크면 거부(오차가 큰 위치는 믿을 수 없음)
 *   applyIn, applyOut,  // 출근 / 퇴근 각각에 적용할지
 *   sites: [{ id, name, lat, lng, radiusMeters? }],  // 근무지(여러 곳 가능, radiusMeters 비우면 기본 반경)
 *   exemptIds: [],      // 제한을 적용하지 않을 사람(외근직·재택 등)
 * }
 * position = { lat, lng, accuracy }  (브라우저 Geolocation 값)
 *
 * 주의: 위치값은 사용자 기기가 보내는 값이라 위조될 수 있다. 서버(DB)에서도 같은 규칙으로 다시 검사하고
 * 좌표·오차·거리를 기록으로 남겨 사후 점검할 수 있게 해야 한다.
 */
const DEFAULT_GEO_POLICY = {
  enabled: false,
  radiusMeters: 200,
  maxAccuracyMeters: 100,
  applyIn: true,
  applyOut: true,
  sites: [],
  exemptIds: [],
};

const EARTH_R = 6371008.8; // m

function haversineMeters(a, b) {
  const rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function nearestSite(sites, position) {
  let best = null;
  for (const site of sites) {
    const distance = haversineMeters(site, position);
    if (!best || distance < best.distance) best = { site, distance };
  }
  return best;
}

const validPos = (p) => p && Number.isFinite(p.lat) && Number.isFinite(p.lng) && Number.isFinite(p.accuracy);

/** @returns {{allowed:boolean, code:string, distance?:number, site?:object, radius?:number, accuracy?:number}} */
function evaluateClock({ policy = DEFAULT_GEO_POLICY, position, userId, action }) {
  if (!policy.enabled) return { allowed: true, code: 'disabled' };
  if ((policy.exemptIds ?? []).includes(userId)) return { allowed: true, code: 'exempt' };
  if ((action === 'in' && !policy.applyIn) || (action === 'out' && !policy.applyOut)) return { allowed: true, code: 'not_applied' };
  if (!policy.sites.length) return { allowed: false, code: 'no_site' };
  if (!validPos(position)) return { allowed: false, code: 'no_location' };
  if (position.accuracy > policy.maxAccuracyMeters) {
    return { allowed: false, code: 'low_accuracy', accuracy: Math.round(position.accuracy) };
  }
  const { site, distance } = nearestSite(policy.sites, position);
  const radius = site.radiusMeters ?? policy.radiusMeters;
  const d = Math.round(distance);
  return {
    allowed: distance <= radius,
    code: distance <= radius ? 'ok' : 'too_far',
    distance: d, site, radius, accuracy: Math.round(position.accuracy),
  };
}

  return `<div class="calhd"><button class="ib" data-a="mnav" data-k="${key}" data-n="-1" aria-label="이전 달">${ico('back')}</button><b>${c.m}월 ${c.y}</b><button class="ib" data-a="mnav" data-k="${key}" data-n="1" aria-label="다음 달">${ico('chev')}</button></div>`;
}
const dowRow = () => `<div class="grid">${DOW.map((d, i) => `<div class="dw ${i === 0 ? 'sun' : ''}">${d}</div>`).join('')}</div>`;
function gridDates(c) {
  const first = `${c.y}-${p2(c.m)}-01`;
  const last = `${c.y}-${p2(c.m)}-${p2(daysInMonth(c.y, c.m))}`;
  const end = addDays(weekStartOf(last), 6);
  const out = [];
  for (let d = weekStartOf(first); d <= end; d = addDays(d, 1)) out.push(d);
  return out;
}

/* ---------- 탭 화면 ---------- */
function homeScreen() {
  const u = me(), t = S.today, sch = scheduleOf(u.id, t), rec = recordOf(u.id, t);
  const st = !rec ? ['출근 전', ''] : rec.clockOut ? ['퇴근 완료', 'ok'] : ['근무 중', 'live'];
  const ws = S.weekStart, we = addDays(ws, 6);
  const act = (() => { let s = 0; for (let d = ws; d <= we; d = addDays(d, 1)) if (d <= t) s += actualDay(u.id, d); return s; })();
  const plan = planRange(u.id, ws, we);
  const scale = 52 * 60, pct = (m) => Math.min(100, (m / scale) * 100);
  const tiles = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), lv = leaveEntries(u.id, ['approved', 'pending']).filter((e) => e.date === d);
    const s = scheduleOf(u.id, d);
    let inner;
    if (lv.length) inner = `<div class="lv">${esc(typeOf(lv[0].typeId).name.split(' ')[0])}</div><div class="lv">${ico('plane').replace('<svg', '<svg width="16" height="16"')}</div>`;
    else if (s) inner = `<div>${s.start}</div><div class="muted">${s.end}</div>`;
    else inner = '<div class="muted">일정<br>없음</div>';
    tiles.push(`<div class="tile ${d === t ? 'today' : ''}"><div class="d ${i === 0 ? 'sun' : ''}">${d === t ? '오늘' : DOW[i]}</div>${inner}</div>`);
  }
  // 1주 평균
  const weeks = [];
  for (let s = '2026-10-04'; addDays(s, 6) < t; s = addDays(s, 7)) { let m = 0; for (let i = 0; i < 7; i++) m += actualDay(u.id, addDays(s, i)); weeks.push([s, m]); }
  const avg = weeks.length ? weeks.reduce((a, [, m]) => a + m, 0) / weeks.length : 0;
  const cards = [];
  if (S.cards.report) cards.push(`<div class="card flush"><button class="rowbtn" data-a="tab" data-k="records">${ico('chart')}내 리포트<span class="chev">${ico('chev')}</span></button></div>`);
  if (S.cards.missing) cards.push(`<div class="card flush"><button class="rowbtn" data-a="attNew" data-k="create">${ico('folder')}출근/퇴근 누락 기록<span class="chev">${ico('chev')}</span></button></div>`);
  if (S.cards.today) cards.push(`<div class="card"><h2>오늘 근무</h2>
    <div class="today-line"><div>${+t.slice(5, 7)}/${+t.slice(8, 10)} (${DOW[dow(t)]})</div>
    <div>${sch ? `${fmt12(sch.start)} - ${fmt12(sch.end)} | ${esc(orgOf(u.orgId).name)}` : '근무일정 없음'} <span class="chip ${st[1]}">${st[0]}</span></div></div>
    <div class="btns"><button class="btn" data-a="sheet" data-k="request">요청</button>
    ${!rec ? '<button class="btn primary" data-a="clock">출근하기</button>' : !rec.clockOut ? '<button class="btn primary" data-a="clock">퇴근하기</button>' : '<button class="btn primary" disabled>퇴근 완료</button>'}</div>
    ${geoActive(u.id) ? `<div class="muted small" style="margin:-4px 0 10px">위치 확인: ${esc(S.geo.sites[0]?.name ?? '근무지')} 반경 ${S.geo.radiusMeters}m 이내에서만 ${[S.geo.applyIn ? '출근' : '', S.geo.applyOut ? '퇴근' : ''].filter(Boolean).join('·')}할 수 있습니다.</div>` : ''}
    <hr style="border:0;border-top:1px solid var(--line)">
    <div class="kv"><b>출근</b><span>${rec ? fmt12(rec.clockIn) : '-'}${locNote(rec && rec.inLoc)}</span></div>
    <div class="kv"><b>퇴근</b><span>${rec && rec.clockOut ? fmt12(rec.clockOut) : '-'}${locNote(rec && rec.outLoc)}</span></div>
    <div class="kv"><b>총 근로시간</b><span class="green">${rec && rec.clockOut ? hours(dailyWorkMinutes(rec, S.policy)) : '-'}</span></div></div>`);
  if (S.cards.week) cards.push(`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>이번주 근무</h3>
    <button class="btn" style="height:36px;border:0;font-weight:500" data-a="sheet" data-k="week">${md(ws).replace('/', '.')} - ${md(we).replace('/', '.')} ${ico('down').replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"')}</button></div>
    <div class="week">${tiles.join('')}</div>
    <div class="bar" role="img" aria-label="이번주 근로시간 ${hours(act)} / 계획 ${hours(plan)}"><div class="plan" style="width:${pct(plan)}%"></div><div class="act" style="width:${pct(act)}%"></div>
      <div class="pl" style="left:${pct(plan)}%">계획 ▾</div><div class="tick" style="left:${pct(40 * 60)}%"></div><div class="tick lim" style="left:100%"></div>
      <div class="lbl" style="left:${pct(40 * 60)}%">40</div><div class="lbl" style="left:98%">52</div></div>
    <div class="sumline" style="margin-top:30px">${hours(act)} <span>/ ${hours(plan)}</span></div></div>`);
  if (S.cards.avg) cards.push(`<div class="card"><h3>1주 평균 근로시간</h3><div class="muted small" style="margin:4px 0 10px">10월, 지난 ${weeks.length}주 기준 (휴가 포함)</div>
    <div class="big">${hours(avg)}</div>
    ${weeks.map(([s, m]) => `<div class="avgrow"><span>${weekLabel(s)}</span><div class="t"><i style="width:${Math.min(100, (m / (52 * 60)) * 100)}%"></i><em style="left:${(40 / 52) * 100}%"></em></div><span style="text-align:right">${hours(m)}</span></div>`).join('')}</div>`);
  cards.push(`<p class="span2" style="text-align:center"><button class="btn" style="border:0;text-decoration:underline;background:none" data-a="sheet" data-k="homeSet">홈 설정</button></p>`);
  return { header: header({ logo: true, right: `<button class="ib" aria-label="메시지">${ico('chat')}<span class="badge gray">0</span></button><button class="ib" aria-label="알림">${ico('bell')}<span class="badge">1</span></button>` }), body: cards.join('') };
}

function scheduleScreen() {
  const c = S.cal, dates = gridDates(c), u = me();
  const evs = (d) => {
    const out = [];
    const lv = leaveEntries(u.id, ['approved', 'pending']).filter((e) => e.date === d);
    const seen = new Set();
    for (const e of lv) { if (seen.has(e.reqId)) continue; seen.add(e.reqId); out.push(`<span class="ev" style="background:${e.status === 'pending' ? '#8a8f99' : '#168a3a'}">✈ ${esc(typeOf(e.typeId).name.split(' ')[0])}</span>`); }
    const s = scheduleOf(u.id, d);
    if (s) out.push(`<span class="ev" style="background:${barColor(s.start + s.end)}"><span class="evfull">${fmt12(s.start).replace(':00', '')}-${fmt12(s.end).replace(':00', '')}</span><span class="evshort">${+s.start.slice(0, 2)}:${s.start.slice(3)}</span></span>`);
    return out.join('');
  };
  const cells = dates.map((d) => `<div class="mcell"><span class="n ${d === S.today ? 'today' : ''} ${+d.slice(5, 7) !== c.m ? 'oth' : ''} ${dow(d) === 0 || isHoliday(d) ? 'sun' : ''}">${+d.slice(8, 10)}</span>${evs(d)}</div>`).join('');
  const list = dates.map((d) => {
    const s = scheduleOf(u.id, d), lv = leaveEntries(u.id, ['approved', 'pending']).filter((e) => e.date === d);
    if (!s && !lv.length) return '';
    const seen = new Set();
    return `<div class="dh ${dow(d) === 0 ? 'sun' : ''}">${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일, ${DOW[dow(d)]}</div>` +
      lv.filter((e) => !seen.has(e.reqId) && seen.add(e.reqId)).map((e) => `<div class="it"><div class="ico">${ico('plane')}</div><div><b>${esc(typeOf(e.typeId).name)}</b><div class="muted small">${statusKo[e.status]}</div></div></div>`).join('') +
      (s ? `<div class="it"><div class="ico">${ico('cal')}</div><div><b>${fmt12(s.start)} - ${fmt12(s.end)}</b><div class="muted small">${esc(orgOf(u.orgId).name)} / 일반직</div></div></div>` : '');
  }).join('');
  return { header: header({ title: '월 근무' }), body: `<div class="bleed"><div class="split"><div class="split-a">${monthNav(c, 'cal')}<div style="background:var(--card)">${dowRow()}<div class="grid">${cells}</div></div></div><div class="daylist split-b">${list}</div></div></div>` };
}

function recordsScreen() {
  const c = S.rec, u = me(), s = monthSummary(u.id, c.y, c.m);
  const rows = [];
  for (let d = 1; d <= daysInMonth(c.y, c.m); d++) {
    const date = `${c.y}-${p2(c.m)}-${p2(d)}`, r = recordOf(u.id, date), lv = leaveMinutesOn(u.id, date);
    if (!r && !lv) continue;
    const w = r && r.clockOut ? dailyWorkMinutes(r, S.policy) : 0;
    rows.push(`<div class="kv" style="padding:10px 16px;border-top:1px solid var(--line)"><span class="${isOffDay(date) ? 'sun' : ''}">${md(date)} (${DOW[dow(date)]})${isOffDay(date) && w ? ' <span class="chip wait">휴일근로</span>' : ''}${S.recOv[u.id] && S.recOv[u.id][date] ? ' <span class="chip live">정정</span>' : ''}</span>
      <span>${r ? `${r.clockIn} - ${r.clockOut ?? '근무 중'}` : ''}${lv ? ` <span class="chip live">휴가 ${hours(lv)}</span>` : ''} <b class="green">${w ? hours(w) : ''}</b></span></div>`);
  }
  return { header: header({ title: '출퇴근기록' }), body: `<div class="bleed span2">${monthNav(c, 'rec')}</div>
    <div class="card"><h3>${c.m}월 근태 집계</h3>
      <div class="kv"><b>평일 합계 (실근로 + 휴가 환산)</b><span class="green"><b>${hours(s.weekdayMinutes)}</b></span></div>
      <div class="kv"><b>└ 실근로</b><span>${hours(s.workMinutes)}</span></div>
      <div class="kv"><b>└ 휴가 환산</b><span>${hours(s.leaveMinutes)}</span></div>
      <div class="kv"><b>휴일근로 (별도 집계)</b><span>${hours(s.holidayWorkMinutes)}</span></div>
      <div class="kv"><b>월 소정근로시간</b><span>${hours(s.scheduled)} (${s.scheduledDays}일)</span></div>
      <div class="muted small">휴게 ${S.policy.breakMinutes}분 고정 공제 · 휴가는 하루 ${S.policy.leaveHoursPerDay}시간 기준 · 규칙은 관리자 설정에서 변경</div></div>
    <div class="card flush">${rows.join('') || '<div class="empty">기록이 없습니다.</div>'}</div>` };
}

function leaveScreen() {
  const u = me(), b = annualBalance(u.id);
  const mine = S.requests.filter((r) => r.userId === u.id && r.kind === 'leave').sort((a, c) => c.dates[0].localeCompare(a.dates[0])).slice(0, 12);
  return { header: header({ title: '휴가' }), body: `<div class="card"><div class="muted small">연차휴가 (${b.period})</div>
    <div class="big" style="margin:6px 0">${b.remaining}일 <span class="muted" style="font-size:16px;font-weight:500">남음</span></div>
    <div class="muted small">부여 ${b.granted}일 · 사용(승인 예정 포함) ${b.used}일 · 기준: ${S.leavePolicy.basis === 'fiscal_year' ? '회계연도' : '입사일'}</div>
    <div class="btns"><button class="btn primary" data-a="leaveNew">휴가 신청</button></div></div>
    <div class="card flush"><div style="padding:14px 16px;font-weight:700">내 휴가 내역</div>${mine.map((r) => `<button class="rowbtn" style="font-weight:500;border-top:1px solid var(--line)" data-a="req" data-id="${r.id}"><div><div>${esc(typeOf(r.typeId).name)}</div><div class="muted small">${r.dates.map(md).join(', ')}</div></div><span class="chip ${badgeClass(r.status)}" style="margin-left:auto">${statusKo[r.status]}</span></button>`).join('') || '<div class="empty">내역이 없습니다.</div>'}</div>` };
}

function requestsScreen() {

  const list = S.seg === 'inbox' ? S.requests.filter((r) => r.approverId === S.userId && r.userId !== S.userId).sort((a, b) => (b.status === 'pending') - (a.status === 'pending'))

    <div class="card flush">${list.map((r) => `<button class="rowbtn" style="font-weight:500;border-top:1px solid var(--line)" data-a="req" data-id="${r.id}"><div><div><b>${esc(person(r.userId).name)}</b> · ${esc(reqTitle(r))}</div><div class="muted small">${reqWhen(r)} · 승인권자 ${esc(person(r.approverId).name)}</div></div><span class="chip ${badgeClass(r.status)}" style="margin-left:auto">${statusKo[r.status]}</span></button>`).join('') || '<div class="empty">요청이 없습니다.</div>'}</div>
    <div class="demo">데모: 메뉴 → 사용자 전환에서 승인권자(이팀장 등)로 바꾸면 “승인 대기” 탭에서 승인·반려할 수 있습니다.</div>` };
}

/* ---------- 휴가 신청 ---------- */
function leaveStep1() {
  const d = S.draft, t = typeOf(d.typeId), u = me();
  const taken = new Set(leaveEntries(u.id, ['approved', 'pending']).map((e) => e.date));
  const pend = t.deductFrom === 'annual' ? annualBalance(u.id).end : null;   // 연차는 현재 연차 기간 안에서만 신청
  const cells = gridDates(d.cal).map((date) => {
    const other = +date.slice(5, 7) !== d.cal.m;
    const past = date < S.today;
    const has = taken.has(date);
    const okDay = t.allowNonWorkdays ? true : isWorkday(date);
    const dis = other || past || has || !okDay || (pend && date > pend);
    const sel = d.dates.includes(date);
    const cls = ['cell', other ? 'other' : '', date === S.today ? 'today' : '', sel ? 'sel' : '', has ? 'dis' : '', (dow(date) === 0 || isHoliday(date)) ? 'off' : '', past && !other ? 'past' : ''].join(' ');
    return `<button class="${cls}" ${dis ? 'disabled' : ''} data-a="pickDate" data-d="${date}" aria-label="${date}${has ? ' (이미 휴가 있음)' : ''}">${+date.slice(8, 10)}</button>`;
  }).join('');
  const extra = d.dates.map((date) => { const r = resolveLeaveType(t); return { date, minutes: r.paidMinutes, deductDays: r.deductDays, typeId: t.id, deductFrom: t.deductFrom }; });
  let msg = '';
  let blocked = false;
  if (t.deductFrom === 'annual') {
    const before = annualBalance(u.id), after = annualBalance(u.id, extra);
    msg = `1. 연차휴가 (${before.period}) 잔여 일수는 ${before.remaining}${d.dates.length ? ` → ${after.remaining}` : ''}일입니다.`;
    if (after.remaining < 0) { msg += ' 잔여 연차가 부족합니다.'; blocked = true; }
  } else if (t.deductFrom === 'quota') {
    const used = quotaUsed(u.id, t), after = quotaUsed(u.id, t, extra);
    msg = `${esc(t.name)} 연 ${t.quotaDays}일 중 잔여 ${t.quotaDays - used}${d.dates.length ? ` → ${t.quotaDays - after}` : ''}일입니다.`;
    if (after > t.quotaDays) { msg += ' 한도를 초과했습니다.'; blocked = true; }
  } else msg = '연차가 차감되지 않는 휴가입니다.';
  return {
    header: header({ back: true, title: '휴가 생성 요청', right: `<button class="btn" style="border:0;color:var(--primary);height:44px" data-a="step2" ${d.dates.length && !blocked ? '' : 'disabled'}>다음</button>` }),
    body: `<div class="bleed"><button class="pick" data-a="sheet" data-k="type"><b>휴가 유형</b><span class="v">[${esc(t.group)}] ${esc(typeLabel(t))} ›</span></button>
    <div style="background:var(--card);margin-top:12px">${monthNav(d.cal, 'draft')}${dowRow()}<div class="grid">${cells}</div></div>
    <div class="foot" role="status">${msg}</div>${t.maxDays ? `<div class="foot muted small">최대 ${t.maxDays}일까지 선택할 수 있습니다.</div>` : ''}</div>`,
  };
}
function leaveStep2() {
  const d = S.draft, t = typeOf(d.typeId), u = me();
  const cands = candidatesFor(u.id, t);
  const ap = d.approverId ? person(d.approverId) : null;
  const r = resolveLeaveType(t);
  const extra = d.dates.map((date) => ({ date, minutes: isWorkday(date) ? r.paidMinutes : 0, deductDays: r.deductDays, typeId: t.id, deductFrom: t.deductFrom }));
  const months = [...new Set(d.dates.map((x) => x.slice(0, 7)))];
  const mon = months.map((k) => {
    const [y, m] = k.split('-').map(Number), from = `${k}-01`, to = `${k}-${p2(daysInMonth(y, m))}`;
    const sc = scheduledMinutes({ year: y, month: m, holidays: Object.keys(S.holidays), dailyMinutes: S.policy.leaveHoursPerDay * 60 }).minutes;
    return `<div style="margin-top:12px"><b>${m}/1 - ${daysInMonth(y, m)}</b> 계획 : ${hours(planRange(u.id, from, to, extra))}<div class="muted small">(휴가: ${hours(leaveRange(u.id, from, to))} → ${hours(leaveRange(u.id, from, to, extra))})<br>소정 : ${hours(sc)}</div></div>`;
  }).join('');
  const bal = t.deductFrom === 'annual' ? (() => { const b = annualBalance(u.id), a = annualBalance(u.id, extra); return `1. 연차휴가 (${b.period}) 잔여 일수는 ${b.remaining} → ${a.remaining}일입니다.`; })() : '';
  const ok = d.reason.trim() && d.approverId;
  return {
    header: header({ back: true, title: '검토: 휴가 생성', right: `<button class="btn" id="sendBtn" style="border:0;color:var(--primary);height:44px" data-a="send" ${ok ? '' : 'disabled'}>보내기</button>` }),
    body: `<div class="bleed"><div class="notice">${ico('bell').replace('<svg', '<svg width="20" height="20" style="flex:none"')}<span>${esc(S.notice)}</span></div>
    <button class="pick ${ap ? '' : 'need'}" style="margin-top:12px" data-a="sheet" data-k="approver"><b>승인권자 <span class="chip live">${ap ? 1 : 0} / 1</span></b><span class="v">${ap ? esc(ap.name) : '선택해 주세요'} ›</span></button>
    ${ap ? `<div class="muted small" style="padding:6px 16px">${esc(approverTitle(ap.id))}</div>` : ''}
    <div class="field"><label for="reason">사유 (필수)</label><textarea id="reason" data-i="reason" placeholder="요청 사유 입력">${esc(d.reason)}</textarea></div>
    <button class="pick" style="margin-top:10px" data-a="soon"><b>사진 첨부 (선택)</b><span class="v">›</span></button>
    <div class="field"><label>요청사항</label>
      <div class="kv"><b>휴가 유형</b><span style="text-align:right">${esc(t.name)}<br><span class="muted small">(${r.paidMinutes / 60}시간, ${r.deductDays}일간) (사유 표시: ${t.showReason ? 'O' : 'X'})</span></span></div>
      <div class="kv"><b>휴가 날짜</b><span style="text-align:right">${d.dates.map((x) => `${+x.slice(5, 7)}월 ${+x.slice(8, 10)}일 (${DOW[dow(x)]})`).join('<br>')}</span></div></div>
    <div class="foot">${bal}${mon}</div>
    ${cands.length ? '' : '<div class="foot" style="color:var(--red)">선택할 수 있는 승인권자가 없습니다. 관리자에게 조직·승인 정책을 확인해 달라고 요청하세요.</div>'}</div>`,
  };
}
function requestDetail(p) {
  const r = S.requests.find((x) => x.id === p.id), mineReq = r.userId === S.userId;
  const canDecide = r.status === 'pending' && r.approverId === S.userId && !mineReq;
  const att = r.kind === 'attendance';
  const rows = att

  }
  if (sh.k === 'homeSet') {

  }
  if (sh.k === 'geoDemo') {
    return wrap(`<div class="sh">실제 서비스에서는 기기 위치를 사용합니다. 여기서는 상황을 골라 시험해 볼 수 있습니다.</div>${Object.keys(DEMO_LOCS).map((k) => `<button class="si ${S.demoLoc === k ? 'on' : ''}" data-a="setDemoLoc" data-k="${k}"><span>${DEMO_LOCS[k]}</span><span>${S.demoLoc === k ? '✓' : ''}</span></button>`).join('')}`);

  return '';

    const loc = res.distance != null ? { distance: res.distance, site: res.site.name, accuracy: res.accuracy } : null;
